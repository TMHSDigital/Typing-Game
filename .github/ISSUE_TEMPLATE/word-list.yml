name: Propose a word list
description: Words for Common Words, or a list for another language.
labels: [content]
body:
  - type: input
    id: language
    attributes:
      label: Language
    validations:
      required: true
  - type: textarea
    id: words
    attributes:
      label: Words
      description: One word per line, lowercase, no duplicates. The English list has 200 words.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Frequency source
      description: Where the list comes from, for example a word-frequency corpus, with a link.
    validations:
      required: true
  - type: checkboxes
    id: license
    attributes:
      label: License
      options:
        - label: The source allows this use, and I have linked it above.
          required: true
